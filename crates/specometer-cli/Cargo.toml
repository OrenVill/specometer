[package]
name = "specometer-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "specometer"
path = "src/main.rs"

[dependencies]
specometer-core = { path = "../specometer-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
