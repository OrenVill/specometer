[package]
name = "specometer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
pulldown-cmark = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
